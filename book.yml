title: "Kernels: The Geometry of Learning"
subtitle: Foundations, Algorithms, and the Frontiers of Machine Intelligence
short_title: Kernels
mark_title: Kernels
mark_subtitle: The Geometry of Learning
slug: kernels-the-geometry-of-learning
language: en
tagline: Similarity becomes geometry. Geometry becomes learning.
cover_kicker: A unified theory of learning through similarity
cover_story: Kernel methods are usually filed away as a finished chapter of pre-deep-learning history. This book treats them as what they are, a living language for turning structure into geometry and geometry into learning. It follows that single idea from Gram matrices to operators, from margins to probability measures, and from finite samples to infinite-width networks, building the theory from first principles and carrying it all the way to working code.
scope_line: foundations to frontiers · free to read online
positioning: A rigorous, unified account of kernel methods—from positive-definite functions and reproducing kernel Hilbert spaces to scalable algorithms, probabilistic inference, scientific applications, and modern feature learning.
authors:
  - name: Taha Bouhsine
    url: https://www.tahabouhsine.com
    affiliation: AzettaAI
    handle: "@azettaai"
source: This book uses the lecture course "Machine Learning with Kernel Methods" by Julien Mairal and Jean-Philippe Vert and the textbooks "Learning with Kernels" and "Kernel Methods for Pattern Analysis" as foundational guides. Francis Bach's "Learning Theory from First Principles" informs the approximation-estimation-optimization decomposition and the insistence that guarantees remain attached to executable algorithms. Later and specialized material is synthesized from the primary research cited in each chapter. The connecting prose, pedagogical organization, checked examples, and original interactive software are this edition's; provenance and review status are recorded separately from attribution.
