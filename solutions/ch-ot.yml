exercises:
  - number: 1
    kind: warm-up
    status: draft
    prompt: Take \(P=\tfrac13(\delta_0+\delta_1+\delta_6)\) and
      \(Q=\tfrac13(\delta_2+\delta_3+\delta_4)\) on the line. Compute \(W_1(P,Q)\) by sorting and
      matching the atoms in order, then verify the same value through the CDF integral
      \(\int_{\mathbb R}|F_P(t)-F_Q(t)|\,dt\). Confirm that at least one crossed pairing costs
      strictly more.
    answer: Monotone matching pairs $(0,2),(1,3),(6,4)$, so $W_1=(2+2+2)/3=2$. In the CDF formula the
      nonzero contributions on $[0,1),[1,2),[2,3),[4,6)$ are respectively $1/3,2/3,1/3,2/3$, again
      totaling 2. A crossed assignment such as $(0,2),(1,4),(6,3)$ costs $(2+3+3)/3=8/3>2$,
      confirming monotone matching is better.
  - number: 2
    kind: computation
    status: draft
    prompt: "With supports \\(\\{0,1\\}\\) and \\(\\{0,1\\}\\), cost
      \\(C=\\bigl(\\begin{smallmatrix}0&1\\\\1&0\\end{smallmatrix}\\bigr)\\), marginals
      \\(a=(0.6,0.4)\\), \\(b=(0.3,0.7)\\), and \\(\\varepsilon=1\\), form \\(K=e^{-C}\\) and run
      one Sinkhorn iteration from \\(v=\\mathbf 1\\): update \\(u=a\\oslash(Kv)\\), then
      \\(v=b\\oslash(K^\\top u)\\). Write the plan
      \\(\\operatorname{diag}(u)K\\operatorname{diag}(v)\\) and check that its column sums equal
      \\(b\\) exactly while its row sums do not yet equal \\(a\\)."
    answer: With $r=e^{-1}$, $K=\begin{pmatrix}1&r\\r&1\end{pmatrix}$. Starting from $v=(1,1)$ gives
      $u=a/(1+r)=(0.438635,0.292423)$. The column update gives $v=(0.549238,1.542570)$. Thus
      $\pi=diag(u)Kdiag(v)\approx\begin{pmatrix}0.240915&0.248917\\0.059085&0.451083\end{pmatrix}$.
      Its column sums are exactly $(0.3,0.7)$ up to rounding, while row sums $(0.489831,0.510169)$
      are not yet $(0.6,0.4)$.
  - number: 3
    kind: proof
    status: draft
    prompt: "Prove weak duality for optimal transport directly: for any coupling \\(\\pi\\in\\Pi(P,Q)\\)
      and any potentials with \\(f(x)+g(y)\\le c(x,y)\\), show \\(\\mathbb E_P[f]+\\mathbb
      E_Q[g]\\le\\int c\\,d\\pi\\), and conclude \\(\\sup_{\\Phi_c}(\\mathbb E_P[f]+\\mathbb
      E_Q[g])\\le\\mathrm{OT}_c(P,Q)\\). State exactly where the marginal property of \\(\\pi\\) and
      the nonnegativity of \\(\\pi\\) are each used."
    answer: Using the marginals of $\pi$, $E_Pf=\int f(x)d\pi(x,y)$ and $E_Qg=\int g(y)d\pi(x,y)$.
      Adding gives $\int[f(x)+g(y)]d\pi$. Feasibility makes the integrand at most $c(x,y)$, and
      nonnegativity of $\pi$ preserves that inequality under integration. Therefore
      $E_Pf+E_Qg\le\int c\,d\pi$. Taking the supremum over feasible potentials and then the infimum
      over couplings proves weak duality. The marginal property supplies the first equality;
      nonnegativity supplies the inequality.
  - number: 4
    kind: proof
    status: draft
    prompt: Derive Kantorovich-Rubinstein from the general dual. Fix the cost \(c(x,y)=\|x-y\|\),
      restrict the dual to pairs of the form \((f,-f)\), and show that feasibility
      \(f(x)-f(y)\le\|x-y\|\) for all \(x,y\) is equivalent to \(f\) being 1-Lipschitz. Conclude
      \(W_1(P,Q)=\sup_{\mathrm{Lip}(f)\le 1}(\mathbb E_P[f]-\mathbb E_Q[f])\), assuming the standard
      fact that the optimum can be taken in this form.
    answer: "For $(f,g)=(f,-f)$, dual feasibility is $f(x)-f(y)\\le\\|x-y\\|$ for all $x,y$. Swapping
      $x,y$ gives the reverse bound, hence $|f(x)-f(y)|\\le\\|x-y\\|$: $f$ is 1-Lipschitz.
      Conversely that Lipschitz inequality immediately implies feasibility. Substitution in the
      objective yields $E_Pf-E_Qf$. Assuming the standard dual-attainment/reduction fact under the
      stated metric-space moment hypotheses, maximizing over these potentials gives the
      Kantorovich--Rubinstein formula."
  - number: 5
    kind: computation
    status: draft
    prompt: Show numerically that entropic transport is biased at zero. For \(a=(0.5,0.5)\) on support
      \(\{0,1\}\) with cost \(C=\bigl(\begin{smallmatrix}0&1\\1&0\end{smallmatrix}\bigr)\) and
      \(\varepsilon=1\), solve \(\mathrm{OT}_\varepsilon(a,a)\) (by symmetry the optimal plan is
      \(\operatorname{diag}(u)K\operatorname{diag}(u)\) with a single scaling \(u\)) and check that
      the entropic cost is strictly positive, so \(\mathrm{OT}_\varepsilon(a,a)\ne 0\). Then confirm
      the debiasing identity \(S_\varepsilon(a,a)=0\) from the definition.
    answer: Let $r=e^{-1}$ and by symmetry set $u_1=u_2=u$. The marginal equation is $u^2(1+r)=1/2$, so
      $u=\sqrt{1/[2(1+e^{-1})]}=0.604590$. The plan is
      $\begin{pmatrix}0.365529&0.134471\\0.134471&0.365529\end{pmatrix}$. Its transport cost is
      $0.268941$ and $KL(\pi\|aa^\top)=0.110944$, so under the chapter's $KL$ convention
      $OT_1(a,a)=0.379885>0$. By definition,
      $S_1(a,a)=OT_1(a,a)-\tfrac12OT_1(a,a)-\tfrac12OT_1(a,a)=0$.
  - number: 6
    kind: exploration
    status: draft
    prompt: On the worked-example pair \(P=\tfrac13(\delta_0+\delta_2+\delta_5)\),
      \(Q=\tfrac13(\delta_1+\delta_3+\delta_4)\) with cost \(c(x,y)=|x-y|\), verify by hand that the
      energy distance \(2\,\mathbb E|X-Y|-\mathbb E|X-X'|-\mathbb E|Y-Y'|\) equals \(0.6667\) and
      hence that the \(\varepsilon\to\infty\) limit of the Sinkhorn divergence, \(\tfrac12\) of
      this, is \(0.3333\). Contrast this with the \(\varepsilon\to 0\) limit \(W_1=1.0\), and say in
      one sentence what each end of the dial is sensitive to that the other is not.
    answer: "Enumerating all nine cross pairs gives $E|X-Y|=17/9$; the two within-sample expectations
      are $E|X-X'|=20/9$ and $E|Y-Y'|=8/9$. Hence the energy distance is $34/9-28/9=6/9=0.6667$, and
      half is $0.3333$. The small-$\\varepsilon$ endpoint is $W_1=1$: it retains sharp optimal
      matching and ground geometry but suffers dimension-dependent sampling error. The
      large-$\\varepsilon$ endpoint averages pairwise energy like an MMD, smoothing local matching
      information in exchange for better statistical stability."
  - number: 7
    kind: challenge
    status: draft
    prompt: "Explain the sample-complexity gap through the size of the witness class. Argue informally
      that the empirical fluctuation of an IPM \\(\\sup_{f\\in\\mathcal F}(\\mathbb E_{\\hat
      P_n}[f]-\\mathbb E_P[f])\\) is governed by the metric entropy of \\(\\mathcal F\\): the RKHS
      unit ball is effectively small (a Donsker class, fluctuation \\(n^{-1/2}\\) independent of
      \\(d\\)), while the 1-Lipschitz ball on a bounded region of \\(\\mathbb R^d\\) has
      \\(\\varepsilon\\)-covering number growing like \\(\\exp(\\varepsilon^{-d})\\), producing the
      \\(n^{-1/d}\\) Wasserstein rate. Conclude why entropic regularization, which effectively
      shrinks the class of achievable dual potentials, improves the statistics."
    answer: An IPM is an empirical-process supremum, so its fluctuation is controlled by the size of its
      witness class, quantified by covering numbers or Rademacher complexity. For a bounded
      characteristic kernel, the RKHS unit ball is a Donsker-type class and the mean-embedding norm
      concentrates at $n^{-1/2}$ without an ambient-dimensional exponent. The 1-Lipschitz ball on a
      bounded subset of $R^d$ has log covering number of order $\epsilon^{-d}$, so resolving
      witnesses at sample spacing yields the $n^{-1/d}$ transport scale in $d\ge3$. Entropic
      regularization smooths and restricts optimal dual potentials, lowering their effective
      entropy; this trades some geometric sharpness and regularization bias for faster, more stable
      estimation.
