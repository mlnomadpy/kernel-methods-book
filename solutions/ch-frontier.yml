exercises:
  - number: 1
    kind: warm-up
    status: complete
    prompt: Prove that the empirical NTK is PSD. Give a condition under which its training Gram is singular.
    answer: For coefficients \(c_i\), \(\sum_{ij}c_ic_j\Theta(x_i,x_j)=\|\sum_i c_i\nabla_\theta f(x_i)\|^2\ge0\). It is singular exactly when the training Jacobian rows are linearly dependent; identical Jacobian rows are one sufficient condition.
  - number: 2
    kind: proof
    status: complete
    prompt: Derive the frozen-kernel gradient-flow solution in Proposition 43.1 when \(\Theta_0\succeq0\) is singular. State the limiting fitted values using the Moore–Penrose pseudoinverse.
    answer: Diagonalize \(\Theta_0=Q\operatorname{diag}(\lambda_j)Q^\top\). Then \(r(t)=Q\operatorname{diag}(e^{-t\lambda_j})Q^\top r(0)\). Components in \(\operatorname{range}(\Theta_0)\) vanish and components in \(\ker\Theta_0\) persist, so \(u(\infty)=y+P_{\ker\Theta_0}(u(0)-y)=u(0)+\Theta_0\Theta_0^\dagger(y-u(0))\). At a point whose cross-kernel lies in the row space, \(f_\infty(x)=f_0(x)+\Theta_0(x,X)\Theta_0^\dagger(y-u(0))\).
  - number: 3
    kind: synthesis
    status: complete
    prompt: Compare the state variables and orders of limits in the NTK and mean-field regimes. Explain why neither theorem automatically describes a finite network trained for an increasing time horizon.
    answer: NTK theory linearizes around the initial parameter and its limiting state is a function evolving under a fixed tangent operator. Mean-field theory uses the empirical neuron measure, which converges to a time-dependent measure transported by a nonlinear flow. Both normally fix the data and a finite horizon before taking width to infinity. A finite network has approximation error, and a horizon growing with width can accumulate kernel drift or particle-discretization error outside the theorem's quantifiers.
  - number: 4
    kind: computation
    status: complete
    prompt: Reproduce the quantum shot-noise example. Verify the minimum eigenvalue and the Frobenius distance to the PSD projection.
    answer: The symmetric matrix has eigenvalues approximately \(-0.223774,0.900000,2.323774\). For a symmetric matrix, projection onto the PSD cone clips negative eigenvalues. The squared Frobenius distance is the sum of squares of clipped eigenvalues, hence the distance is \(0.223774\).
  - number: 5
    kind: proof
    status: complete
    prompt: Prove that the fidelity kernel is PSD by embedding pure-state density matrices in the Hilbert–Schmidt space.
    answer: Put \(\rho_x=|\phi(x)\rangle\langle\phi(x)|\). Then \(\langle\rho_x,\rho_{x'}\rangle_{\mathrm{HS}}=\operatorname{tr}(\rho_x\rho_{x'})=|\langle\phi(x)|\phi(x')\rangle|^2\). Therefore \(\sum_{ij}c_ic_jk(x_i,x_j)=\|\sum_i c_i\rho_{x_i}\|_{\mathrm{HS}}^2\ge0\).
  - number: 6
    kind: synthesis
    status: complete
    prompt: A quantum-kernel paper reports higher accuracy than an RBF SVM but omits shot counts, circuit-evaluation cost, kernel-selection folds, and pre-repair eigenvalues. Classify which claims remain supported.
    answer: The reported accuracy difference is a descriptive result for the released matrix if reproducible, and the ideal circuit kernel remains PSD by construction. Claims of computational advantage, fair model comparison, finite-shot reliability, and validity of any PSD repair are unsupported. Generalization is also uncertain because kernel selection may have reused validation or test information.
  - number: 7
    kind: synthesis
    status: complete
    prompt: Design a nested frozen-feature evaluation protocol when choosing among four encoder layers, three pooling rules, and five ridge parameters.
    answer: Split raw entities into outer training and test sets before embedding and deduplicate across the boundary. Inside each outer-training fold, evaluate the \(4\cdot3\cdot5=60\) choices using inner validation folds, fitting centering and every transform within each inner training fold. Select one pipeline, refit it on all outer-training data, and evaluate once on the untouched outer test set. Repeat outer folds if uncertainty is needed, and record encoder checksum, preprocessing, seeds, and overlap audits.
  - number: 8
    kind: challenge
    status: complete
    prompt: A team selects a projection using all labels and then freezes it before fitting ridge regression. Prove that the resulting Gram is PSD, then explain why its held-out risk estimate is still invalid.
    answer: For the realized label-dependent map \(T_yE(x)\), the Gram is \(ZZ^\top\succeq0\), where row \(i\) of \(Z\) is \(T_yE(x_i)\). PSD is therefore intact. The risk estimate is invalid because held-out labels affected \(T_y\), so the predictor-selection procedure was not independent of the test outcomes. Freezing after leakage does not undo the dependence.
