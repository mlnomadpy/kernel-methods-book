exercises:
  - number: 1
    kind: warm-up
    status: draft
    prompt: Take the \(2\times 2\) similarity matrix \(K=\begin{pmatrix}1&2\\2&1\end{pmatrix}\). Compute
      its eigenvalues and eigenvectors by hand, confirm it is indefinite, and write its
      decomposition \(K=K_+-K_-\) explicitly. Then compute the induced squared distance
      \(d^2(1,2)=K_{11}+K_{22}-2K_{12}\) and explain in one sentence why its sign certifies that
      \(K\) is not a Gram matrix of any Euclidean configuration.
    answer: The normalized eigenvectors are $u_+=(1,1)/\sqrt2$ and $u_-=(1,-1)/\sqrt2$, with eigenvalues
      3 and $-1$. Hence $K_+=3u_+u_+^\top=\tfrac32\begin{pmatrix}1&1\\1&1\end{pmatrix}$ and
      $K_-=u_-u_-^\top=\tfrac12\begin{pmatrix}1&-1\\-1&1\end{pmatrix}$, and $K=K_+-K_-$. The induced
      squared distance is $1+1-4=-2$, impossible for a Euclidean squared norm and therefore
      certifying indefiniteness.
  - number: 2
    kind: computation
    status: draft
    prompt: For the same \(K=\begin{pmatrix}1&2\\2&1\end{pmatrix}\), apply each of the three spectrum
      transforms. Show that clip gives
      \(K_{\text{clip}}=\begin{pmatrix}1.5&1.5\\1.5&1.5\end{pmatrix}\), find the flip and shift
      matrices, and verify that shift changes only the diagonal while adding the same constant to
      \(d^2(1,2)\). Which transform leaves the off-diagonal entry \(K_{12}=2\) unchanged, and which
      two alter it?
    answer: "Clipping $(-1,3)$ to $(0,3)$ gives
      $K_{clip}=\\begin{pmatrix}1.5&1.5\\\\1.5&1.5\\end{pmatrix}$. Flipping gives eigenvalues
      $(1,3)$ and $K_{flip}=\\begin{pmatrix}2&1\\\\1&2\\end{pmatrix}$. Shifting by $\\eta=1$ gives
      $K_{shift}=K+I=\\begin{pmatrix}2&2\\\\2&2\\end{pmatrix}$. The original $d^2=-2$ becomes 0
      under shift: each diagonal gains one, so every pairwise squared distance gains $2\\eta$. Shift
      alone leaves $K_{12}=2$ unchanged; clip and flip change it to 1.5 and 1."
  - number: 3
    kind: proof
    status: draft
    prompt: "Prove that clipping yields the nearest positive semidefinite matrix in Frobenius norm: for
      a symmetric \\(K=U\\Lambda U^\\top\\), show \\(K_+=U\\max(\\Lambda,0)U^\\top\\) minimizes
      \\(\\|K-M\\|_F\\) over all \\(M\\succeq 0\\), and that the minimum equals
      \\(\\big(\\sum_{\\lambda_i\\lt 0}\\lambda_i^2\\big)^{1/2}\\)."
    answer: By orthogonal invariance, put $N=U^\top MU\succeq0$ and minimize
      $\|\Lambda-N\|_F^2=\sum_i(\lambda_i-N_{ii})^2+\sum_{i\ne j}N_{ij}^2$. PSD implies
      $N_{ii}\ge0$. The off-diagonal minimum is zero, and each diagonal scalar projection onto
      $[0,\infty)$ is $N_{ii}=\max(\lambda_i,0)$. Transforming back yields $M=K_+$. The surviving
      error has entries $\lambda_i$ only where $\lambda_i<0$, hence norm
      $(\sum_{\lambda_i<0}\lambda_i^2)^{1/2}$.
  - number: 4
    kind: proof
    status: draft
    prompt: The shift transform replaces \(K\) by \(K+\eta I\). Show that this replaces
      \(G=\operatorname{diag}(y)K\operatorname{diag}(y)\) by \(G+\eta I\), so every eigenvalue of
      \(G\) rises by \(\eta\), and conclude that the SVM dual becomes concave exactly when
      \(\eta\ge|\lambda_{\min}(K)|\). Explain why this restores convexity only by changing the
      optimization problem, and connect the added \(\eta\) to the self-similarity inflation noted in
      the transform table.
    answer: "With $D=diag(y)$ and $D^2=I$, $D(K+\\eta I)D=DKD+\\eta I=G+\\eta I$. Thus its eigenvalues
      are $\\lambda_i(G)+\\eta$, and the dual Hessian $-(G+\\eta I)$ is negative semidefinite iff
      $\\eta\\ge-\\lambda_{min}(G)=|\\lambda_{min}(K)|$ when a negative eigenvalue exists. This is a
      different objective: it raises every self-similarity and changes the quadratic penalty, even
      though it preserves off-diagonal similarities."
  - number: 5
    kind: computation
    status: draft
    prompt: Verify the Krein feature map of the worked example. Using the eigenpairs of the running
      \(K\), form \(\Phi(x_i)_\ell=\sqrt{|\lambda_\ell|}\,U_{i\ell}\) and
      \(J=\operatorname{diag}(\operatorname{sign}\lambda_\ell)\), and check that \(\Phi(x_2)^\top
      J\,\Phi(x_2)=K_{22}=0.6044\) while the plain dot product \(\Phi(x_2)^\top\Phi(x_2)\) does not
      equal \(K_{22}\). Which coordinate is responsible for the discrepancy, and what is its sign in
      \(J\)?
    answer: "The worked-example row is $\\Phi(x_2)=(-0.3134,0.3742,0.7500)$ with $J=diag(-1,1,1)$. Its
      Krein square is $-0.3134^2+0.3742^2+0.7500^2\\approx0.6044$, while its Euclidean square is
      $0.3134^2+0.3742^2+0.7500^2\\approx0.8008$. The first coordinate causes the difference: it is
      the negative-eigenvalue direction and carries sign $-1$ in $J$."
  - number: 6
    kind: proof
    status: draft
    prompt: The Lemma of Section (Krein spaces) shows any finite symmetric \(K\) is a difference of two
      positive semidefinite matrices. Complementing it, exhibit a small explicit example proving the
      difference of two positive definite kernels need not be positive definite, by giving two
      \(2\times 2\) positive definite matrices whose difference has a negative eigenvalue. Then
      explain why the finite Lemma does not by itself produce a kernel decomposition \(k=k_+-k_-\)
      on an infinite domain \(\mathcal X\), and what additional property the negative part \(k_-\)
      must possess.
    answer: Take $A=diag(3,1)$ and $B=diag(1,2)$; both are positive definite, but $A-B=diag(2,-1)$ is
      indefinite. On a finite sample spectral splitting always constructs two PSD matrices, but
      those matrices may depend inconsistently on the chosen sample and need not be restrictions of
      fixed functions on an infinite domain. A global decomposition requires $k_-$ (and $k_+$) to be
      a bona fide positive-definite kernel on every finite subset, with a well-defined RKHS and the
      continuity/convergence needed by the RKKS construction.
  - number: 7
    kind: exploration
    status: draft
    prompt: The shift transform adds \(\eta=|\lambda_{\min}|\) to every diagonal entry. Show that for
      kernel ridge regression the shifted dual coefficients \(\alpha=(K+\eta I+\rho I)^{-1}y\) are
      exactly the raw-kernel coefficients with an enlarged ridge \(\rho+\eta\). Argue from this
      that, for a regularized machine, shift adds no discriminative information beyond turning up
      the regularization, and contrast this with clip and flip, which alter the off-diagonal
      similarities.
    answer: "Simply combine the diagonal terms: $(K+\\eta I+\\rho I)^{-1}y=(K+(\\rho+\\eta)I)^{-1}y$.
      Thus for KRR, shift is algebraically an increased ridge and adds no new cross-sample
      information. Clip replaces negative eigenvalues by zero and flip changes their signs; both
      generally modify off-diagonal entries and the discriminative geometry, so neither can be
      absorbed into a scalar regularizer."
  - number: 8
    kind: challenge
    status: draft
    prompt: Consider the stabilization \(\operatorname{stab}_{f\in\mathcal K}\,\tfrac12\langle
      f,f\rangle_{\mathcal K}+C\sum_i\max(0,1-y_if(x_i))\) with \(\langle f,f\rangle_{\mathcal
      K}=\alpha^\top K\alpha\) after the representer expansion. Using \(K=S|K|\) with \(S\) the
      fundamental symmetry, motivate why the change of variable that flips \(K\) to \(|K|\) converts
      the indefinite quadratic \(\alpha^\top K\alpha\) into a positive definite one, and hence why
      the saddle problem becomes a convex minimization. State precisely what the classifier
      evaluates at a new point, and why this differs from simply training an SVM on the clipped
      matrix \(K_+\).
    answer: In the eigenbasis, stabilization minimizes positive coordinates and maximizes negative ones.
      The fundamental symmetry $S=U sign(\Lambda)U^\top$ reverses the negative coordinates, and
      $K=S|K|$ turns their signed quadratic into the Hilbert quadratic governed by $|K|\succeq0$
      after the corresponding coefficient change. This yields the convex auxiliary SVM described in
      the chapter, although the exact coefficient map must be retained. At prediction time it
      evaluates $sign(\sum_i\beta_i k(x_i,x)+b)$ with the original $k=k_+-k_-$. A clipped SVM
      instead trains and predicts with $k_+$, deleting the negative component rather than using the
      flip only as a convexification device.
