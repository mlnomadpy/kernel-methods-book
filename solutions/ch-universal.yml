exercises:
  - number: 1
    kind: warm-up
    status: draft
    prompt: >-
      Write the excess risk of an estimator \(\hat f_n\) chosen from a class \(\mathcal F\) as the sum of an estimation term and an approximation term, state which term is random and which is deterministic, and explain in two sentences which term universality controls and which term capacity controls, and why no algorithm confined to \(\mathcal F\) can reduce the approximation term.
    answer: >-
      The split is R(f_n)-R* = [R(f_n)-inf_{f in F} R(f)] + [inf_{f in F} R(f)-R*]. The first
      bracket is the estimation error, a random quantity depending on the sample and shrinking with
      n; the second is the approximation error, a deterministic number fixed by F and the
      distribution alone. Universality controls the approximation term, since a dense RKHS (union of
      balls as the penalty relaxes) drives inf_{f in F} R(f) down to R* for every continuous target;
      capacity controls the estimation term, since covering numbers or Rademacher averages of the
      ball bound the empirical-to-population gap. No algorithm confined to F can reduce the
      approximation term because every output it can produce lies in F, and the infimum over F is a
      lower bound on the risk of any such output; the term contains no randomness for an algorithm
      to average away.
  - number: 2
    kind: computation
    status: draft
    prompt: >-
      Let \(B_d\) be the unit ball of \(\mathbb R^d\) in some norm. Show by a volume comparison that \(\mathcal N(\varepsilon,B_d)\le(1+2/\varepsilon)^d\) for \(0 \lt \varepsilon\le 1\), then evaluate the bound for \(d=3\) and \(\varepsilon=0.5\), obtaining \(125\), and for \(\varepsilon=0.25\), obtaining \(729\). Conclude that \(\log\mathcal N\) grows linearly in \(d\) and only logarithmically in \(1/\varepsilon\), and contrast this with the polynomial growth \(\varepsilon^{-d/s}\) of a Matern RKHS ball.
    answer: >-
      Take a maximal epsilon-separated set x_1,...,x_M in B_d. Balls of radius epsilon/2 around the
      x_i are pairwise disjoint and contained in (1+epsilon/2)B_d, so comparing volumes gives
      M (epsilon/2)^d vol(B_d) le (1+epsilon/2)^d vol(B_d), hence M le ((1+epsilon/2)/(epsilon/2))^d
      = (1+2/epsilon)^d. By maximality every point of B_d is within epsilon of some x_i, so the
      centers form an epsilon-cover and N(epsilon,B_d) le M. For d=3, epsilon=0.5 the base is
      1+4=5 and the bound is 5^3=125; for epsilon=0.25 the base is 1+8=9 and the bound is 9^3=729.
      Thus log N le d log(1+2/epsilon), linear in d and logarithmic in 1/epsilon, whereas a Matern
      RKHS ball has log N of order epsilon^{-d/s}, polynomial in 1/epsilon; the infinite-dimensional
      ball is exponentially more expensive to cover at fine scales, which is exactly why its
      generalization bounds carry slower rates.
  - number: 3
    kind: proof
    status: draft
    prompt: >-
      Prove that the polynomial kernel \(k(x,y)=(\langle x,y\rangle+1)^m\) of fixed degree \(m\) is not universal on \([0,1]\): identify the RKHS as a space of polynomials, bound its dimension, prove that a finite-dimensional subspace of \(C([0,1])\) is closed in the uniform norm, and exhibit the resulting contradiction with density. State exactly where the argument uses that \([0,1]\) has infinitely many points.
    answer: >-
      Expanding (xy+1)^m by the binomial theorem shows every k(.,y) is a polynomial of degree at
      most m in x, so the RKHS, being the closed span of the k(.,y), lies inside P_m =
      span{1,x,...,x^m}, of dimension m+1. Any finite-dimensional subspace V of a normed space is
      closed because a Cauchy sequence in V has coordinates (in a fixed basis) that are Cauchy in a
      finite-dimensional coordinate space, where all norms are equivalent, so the limit stays in V.
      Hence the uniform closure of the RKHS is contained in P_m. If the kernel were universal that
      closure would be C([0,1]), so C([0,1]) would have dimension at most m+1. But choosing m+2
      distinct points t_0,...,t_{m+1} in [0,1] and continuous functions realizing arbitrary values
      there (piecewise-linear interpolants suffice) shows the restriction map onto R^{m+2} is
      surjective, so dim C([0,1]) ge m+2, a contradiction. The infinitude of [0,1] is used exactly
      once, to supply m+2 distinct evaluation points; on a finite set with at most m+1 points the
      polynomials already exhaust all functions and no contradiction arises.
  - number: 4
    kind: computation
    status: draft
    prompt: >-
      For the three-point Gram matrix of the worked example, with operator eigenvalues \(1.1381\), \(0.6667\), \(0.1953\), compute the effective dimension \(\mathcal N(\lambda)\) at \(\lambda=0.01\) to four decimals, verify the value \(2.9278\), and explain the monotone trend of \(\mathcal N(\lambda)\) across \(\lambda\in\{1,0.1,0.01\}\) in terms of which spectral directions the regularizer has released.
    answer: >-
      Each direction contributes mu/(mu+lambda). At lambda=0.01 the three ratios are
      1.1381/1.1481=0.9913, 0.6667/0.6767=0.9852, and 0.1953/0.2053=0.9513, and their sum is
      0.9913+0.9852+0.9513=2.9278. Across lambda in {1, 0.1, 0.01} the effective dimension climbs
      1.0957, 2.4501, 2.9278 because each ratio mu/(mu+lambda) is decreasing in lambda: at lambda=1
      only the top direction is more than half open, at lambda=0.1 the second direction is
      essentially released (0.8696) and the weak third is half open (0.6613), and at lambda=0.01 all
      three ratios exceed 0.95, so the regularizer has released even the weakest direction and
      N(lambda) approaches the rank 3, the finite-sample stand-in for unbounded capacity.
  - number: 5
    kind: synthesis
    status: draft
    prompt: >-
      Connect the universal and characteristic notions: prove that a universal kernel on a compact space is characteristic, explain why the converse can fail by comparing the signed-measure and probability-measure test classes, and then use the spectral-support criterion to classify the Gaussian kernel and the sinc kernel on \(\mathbb R\), stating for each whether an MMD two-sample test built on it can be blind to some pair of distinct distributions.
    answer: >-
      Universality implies characteristic. Suppose mu_P = mu_Q. Then E_P[g] = E_Q[g] for all g in
      the RKHS, by the reproducing property. For any continuous f and epsilon, density in the
      uniform norm gives g with sup-distance at most epsilon from f, so |E_P[f]-E_Q[f]| le 2 epsilon
      plus zero; letting epsilon go to zero, all continuous functions integrate equally, and on a
      compact metric space the Riesz representation theorem forces P=Q. The converse can fail
      because the Micchelli-Xu-Zhang criterion identifies universality with injectivity of the
      kernel embedding on all finite signed measures, while the characteristic property demands
      injectivity only on differences P-Q of probability measures, which are signed measures of
      total mass zero; a kernel can be injective on that thinner class without being injective on
      all signed measures. On R, the Gaussian kernel has a Gaussian spectral density, positive
      everywhere, so its spectral measure has full support and the kernel is characteristic; an MMD
      test built on it has positive population MMD for every pair of distinct distributions. The
      sinc kernel has spectral measure uniform on a bounded interval, so any two distributions whose
      characteristic functions agree on that interval but differ at higher frequencies embed
      identically; the population MMD is zero and the test is structurally blind to that pair at
      every sample size.
  - number: 6
    kind: exploration
    status: draft
    prompt: >-
      You must fix one kernel before seeing data whose smoothness is unknown. Using the benchmark scalings of this chapter, log-polynomial entropy and near-exponential eigenvalue decay for the Gaussian against polynomial entropy \(\varepsilon^{-d/s}\) and decay \(j^{-(2s+d)/d}\) for a Matern of smoothness \(s\), argue which risks each choice carries when the target is rougher or smoother than assumed, and describe an experiment on held-out data that would reveal which regime you are in.
    answer: >-
      The Gaussian bet is small capacity: with near-exponential eigenvalue decay the effective
      dimension grows only logarithmically as lambda shrinks, so if the target is very smooth the
      variance term is tiny and estimation is close to parametric. The risk is misspecification
      bias: a target with only s derivatives is far from the Gaussian RKHS, the best approximant's
      norm blows up as lambda decreases, and the observed error plateaus at an approximation floor
      that data cannot remove. The Matern bet is larger capacity: polynomial entropy
      epsilon^{-d/s} and decay j^{-(2s+d)/d} give slower, polynomial rates, but the space genuinely
      contains rough functions, so a rough target degrades the rate rather than installing a floor;
      the cost when the target is actually very smooth is paying Matern variance for smoothness the
      kernel does not exploit. A revealing experiment is a learning-curve plus regularization-path
      diagnostic on held-out data: fit both kernels across a grid of n (subsampled) and lambda, and
      plot validation error against n at the per-n best lambda. A persistent plateau for the
      Gaussian while the Matern keeps improving indicates the rough regime; parallel curves with the
      Gaussian uniformly below, and its best lambda staying moderate, indicate the smooth regime.
      Watching whether the selected lambda crashes toward zero as n grows gives the same signal
      through the effective-dimension dial.
  - number: 7
    kind: challenge
    status: draft
    prompt: >-
      Reconcile the consistency theorem with the no-free-lunch theorem: explain why a pointwise limit for every distribution is compatible with the absence of any uniform rate, then exhibit a restricted class over which uniform rates do exist by combining a source condition \(f_\star=T^r w\) with an eigenvalue decay condition, and indicate which chapter quantities measure the size of that class on the target side and on the space side.
    answer: >-
      Consistency asserts that for each fixed distribution P the risk converges: the sample size
      n(epsilon, P) needed to reach accuracy epsilon may depend on P without bound. A rate is a
      single function of n valid simultaneously over a class; the no-free-lunch construction
      diagonalizes against any proposed rate a_n by concentrating the distribution on ever-finer
      structure that the first n samples cannot see, so for every rule some distribution violates
      a_n infinitely often. The two statements quantify over (P, n) in different orders, so both
      hold. Uniform rates return on the minimax class of the source-and-capacity theory: targets
      satisfying f_star = T^r w with ||w|| le R, over marginals whose integral operator has
      eigenvalue decay mu_j of order j^{-b} with b greater than 1. On this class regularized
      least squares with lambda_n chosen by balancing achieves excess risk of order
      n^{-2rb/(2rb+1)} (in the standard parameterization with r in (0,1]), and matching lower
      bounds make it minimax. The target-side size is measured by the source exponent r and radius
      R, the alignment of f_star with the strong eigendirections of T; the space-side size is
      measured by the decay exponent b, equivalently the effective dimension N(lambda) of order
      lambda^{-1/b}, the same capacity dial read from entropy numbers or eigenvalue asymptotics.
