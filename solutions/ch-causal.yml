exercises:
  - number: 1
    kind: warm-up
    status: draft
    prompt: The worked example certified \(X \perp Z \mid Y\) for data generated by the chain \(X\to
      Y\to Z\). Show that the fork \(X \leftarrow Y \to Z\) and the reversed chain \(Z\to Y\to X\)
      imply the same single conditional independence and no other. Conclude that a
      conditional-independence test alone cannot orient the edges among these three variables, and
      name one extra source of information, from the modeling assumptions or the data-collection
      design, that would break the tie.
    answer: A chain X->Y->Z, fork X<-Y->Z, and reversed chain Z->Y->X all have the same skeleton X-Y-Z
      and no collider. Each entails X independent of Z given Y, with no additional marginal
      conditional independence in general. They are Markov equivalent, so conditional-independence
      data alone cannot orient the two edges. Time order, randomized intervention, known causal
      direction, non-Gaussian/additive-noise asymmetry, or another justified structural assumption
      can break the tie.
  - number: 2
    kind: computation
    status: draft
    prompt: "Verify the residual-maker identity \\(I - \\tilde K_Z(\\tilde K_Z + \\varepsilon I)^{-1} =
      \\varepsilon(\\tilde K_Z + \\varepsilon I)^{-1}\\) used in KCIT. Then describe the two limits
      of \\(R_Z\\): what operator does it approach as \\(\\varepsilon \\to 0\\), and what as
      \\(\\varepsilon \\to \\infty\\), and explain why each extreme destroys the test, one by
      removing too much and the other by partialling out nothing."
    answer: Use K(K+epsilon I)^{-1}=I-epsilon(K+epsilon I)^{-1}, obtained by writing K=(K+epsilon
      I)-epsilon I. Rearrangement gives the identity. Spectrally, R_Z has filter
      epsilon/(lambda_j+epsilon). As epsilon->0 it approaches projection onto ker(K_Z), removing all
      directions explained by Z (and for full rank tends to zero), which can erase signal. As
      epsilon->infinity it approaches I, so nothing is residualized and ordinary
      dependence/confounding remains. Intermediate regularization balances conditioning and
      partialling-out strength.
  - number: 3
    kind: proof
    status: draft
    prompt: Show that with linear kernels \(k_X(x,x')=xx'\) and \(k_Z(z,z')=zz'\) on centered scalar
      data, the KIV algorithm reduces to two-stage least squares, \(\hat\beta =
      \widehat{\operatorname{Cov}}(\hat X, Y)/\widehat{\operatorname{Var}}(\hat X)\) with \(\hat X\)
      the least-squares projection of \(X\) on \(Z\).
    answer: With centered linear features, the first KIV/ridge stage estimates Xhat=P_Z X (or its
      regularized version). The second stage minimizes ||Y-beta Xhat||^2, whose normal equation is
      beta=(Xhat^T Y)/(Xhat^T Xhat)=Covhat(Xhat,Y)/Varhat(Xhat). Because Xhat is the least-squares
      projection on Z, this is precisely two-stage least squares. In covariance form the same
      expression is Cov(Z,Y)/Cov(Z,X) for one unregularized scalar instrument when the relevant
      denominators are nonzero.
  - number: 4
    kind: computation
    status: draft
    prompt: "For the confounded model of Worked Example 2, derive the omitted-variable bias of ordinary
      least squares, \\(\\hat\\beta_{\\mathrm{OLS}} \\to \\beta +
      \\gamma\\,\\widehat{\\operatorname{Cov}}(X,U)/\\widehat{\\operatorname{Var}}(X)\\), starting
      from \\(Y=\\beta X + \\gamma U\\). Check it against the sample: with \\(\\gamma=3\\),
      \\(\\widehat{\\operatorname{Cov}}(X,U)=0.667\\), and
      \\(\\widehat{\\operatorname{Var}}(X)=1.667\\), confirm the bias is \\(1.2\\) and hence
      \\(\\hat\\beta_{\\mathrm{OLS}}=3.2\\)."
    answer: "OLS probability/sample limit is Cov(X,Y)/Var(X). Substituting Y=beta X+gamma U gives
      beta+gamma Cov(X,U)/Var(X). With the stated numbers the added term is 3(0.667/1.667),
      approximately 1.2, so beta=2 produces 3.2. The calculation isolates confounding: the
      structural residual gamma U is correlated with the regressor, violating OLS exogeneity."
  - number: 5
    kind: exploration
    status: draft
    prompt: Re-run the check script for Worked Example 1 after replacing \(Z\) by values that track
      \(X\) inside each stratum of \(Y\) (so the chain becomes a structure in which \(Y\) no longer
      screens off \(X\) from \(Z\)). Confirm that the KCIT statistic jumps from numerical zero to
      \(0.097\), and explain in one sentence why a causal-discovery algorithm needs exactly this
      behavior, a near-zero statistic under independence and a clearly positive one otherwise.
    answer: "After altering Z so it retains within-Y variation aligned with X, the residualized X and
      Z-related outcome structure no longer vanish together; the script's KCIT statistic increases
      from numerical zero to 0.097. This is the required discovery behavior: accept a screened-off
      pair as conditionally independent, but return a clearly positive residual dependence when the
      proposed conditioning set fails to block the path."
  - number: 6
    kind: proof
    status: draft
    prompt: Interpret the KCIT statistic as a partial dependence. Dropping the augmentation, show that
      \(\tfrac1n\operatorname{Tr}(\tilde K_{X\mid Z}\,\tilde K_{Y\mid Z})\) is, up to normalization,
      the HSIC between the RKHS residuals of \(X\) and of \(Y\) after each is regressed on \(Z\),
      and relate this to the partial-covariance reading of \(\Sigma_{XY\mid
      Z}=\Sigma_{XY}-\Sigma_{XZ}\Sigma_{ZZ}^{-1}\Sigma_{ZY}\).
    answer: "Residual kernels R_Z K_X R_Z and R_Z K_Y R_Z are Gram matrices of regularized RKHS residual
      features after predicting each view from Z. Their trace product divided by n (up to
      centering/normalization conventions) is HSIC between those residuals, so it measures
      dependence left after Z. This is the nonlinear operator analogue of partial covariance
      Sigma_XY-Sigma_XZ Sigma_ZZ^{-1}Sigma_ZY: both subtract the component transmitted through
      linear/feature regression on Z before measuring association."
  - number: 7
    kind: challenge
    status: draft
    prompt: "Suppose the exclusion restriction fails, so the instrument has a direct effect: \\(Y =
      \\beta X + \\delta Z + \\gamma U\\) with \\(\\delta \\ne 0\\), while stage 1 is \\(X = aZ +
      U\\) with \\(\\operatorname{Cov}(Z,U)=0\\). Show that two-stage least squares now estimates
      \\(\\beta + \\delta/a\\) rather than \\(\\beta\\), so a small direct effect masquerades as a
      change in the structural slope. Discuss why no test on the observed \\((X,Y,Z)\\) can detect
      this bias."
    answer: Stage one gives Xhat=aZ. Then Cov(Xhat,Y)/Var(Xhat)=Cov(aZ,beta(aZ+U)+delta Z+gamma
      U)/(a^2Var Z). Exogeneity Cov(Z,U)=0 leaves [a(beta a+delta)Var Z]/[a^2Var Z]=beta+delta/a.
      Thus a direct instrument effect is indistinguishable from a shifted structural slope. With one
      instrument and no additional exclusion information, the observed joint law admits
      observationally equivalent decompositions trading beta against delta; exclusion is an
      identifying assumption, not generally testable from (X,Y,Z) alone. Multiple valid instruments
      or experimental/domain restrictions can create overidentifying checks.
