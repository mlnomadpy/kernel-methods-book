<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2560" viewBox="0 0 1600 2560" role="img" aria-labelledby="cover-title cover-desc">
  <title id="cover-title">Kernels: The Geometry of Learning</title>
  <desc id="cover-desc">Book cover with an abstract Gaussian Gram-matrix motif, by Taha Bouhsine.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f1e7d6"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a4c1f" stop-opacity="0"/>
      <stop offset="0.48" stop-color="#8a4c1f" stop-opacity="0.38"/>
      <stop offset="0.52" stop-color="#8a4c1f" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#8a4c1f" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="62" height="62" patternUnits="userSpaceOnUse">
      <rect width="54" height="54" rx="4" fill="#8a4c1f" fill-opacity="0.12"/>
    </pattern>
    <clipPath id="matrix-clip"><rect x="880" y="180" width="560" height="560" rx="18"/></clipPath>
  </defs>

  <rect width="1600" height="2560" fill="url(#paper)"/>
  <rect x="0" y="0" width="18" height="2560" fill="#8a4c1f"/>
  <rect x="96" y="104" width="1408" height="2" fill="#d7c8b2"/>

  <g clip-path="url(#matrix-clip)">
    <rect x="880" y="180" width="560" height="560" fill="url(#grid)"/>
    <path d="M760 60 L1560 860" stroke="url(#band)" stroke-width="260"/>
    <path d="M850 150 L1470 770" stroke="#8a4c1f" stroke-opacity="0.56" stroke-width="12"/>
  </g>
  <text x="880" y="785" font-family="Helvetica, Arial, sans-serif" font-size="28" letter-spacing="3" fill="#6e6256">GAUSSIAN GRAM GEOMETRY</text>

  <text x="112" y="410" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="7" fill="#8a4c1f">A UNIFIED THEORY OF LEARNING THROUGH SIMILARITY</text>

  <text x="104" y="1060" font-family="Georgia, 'Times New Roman', serif" font-size="220" font-weight="700" letter-spacing="-9" fill="#1d2126">KERNELS</text>
  <text x="112" y="1215" font-family="Georgia, 'Times New Roman', serif" font-size="102" font-weight="600" fill="#8a4c1f">The Geometry of Learning</text>

  <line x1="112" y1="1300" x2="630" y2="1300" stroke="#8a4c1f" stroke-width="8"/>
  <text x="112" y="1420" font-family="Helvetica, Arial, sans-serif" font-size="48" fill="#30363d">
    <tspan x="112" dy="0">Foundations, Algorithms, and the</tspan>
    <tspan x="112" dy="68">Frontiers of Machine Intelligence</tspan>
  </text>

  <text x="112" y="1735" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-style="italic" fill="#59616b">Similarity becomes geometry.</text>
  <text x="112" y="1800" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-style="italic" fill="#59616b">Geometry becomes learning.</text>

  <g transform="translate(112 2210)">
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="5" fill="#8a4c1f">WRITTEN BY</text>
    <text x="0" y="82" font-family="Georgia, 'Times New Roman', serif" font-size="70" font-weight="700" fill="#1d2126">Taha Bouhsine</text>
    <text x="0" y="140" font-family="Helvetica, Arial, sans-serif" font-size="30" letter-spacing="1.5" fill="#59616b">AzettaAI · tahabouhsine.com</text>
  </g>

  <rect x="112" y="2450" width="1376" height="2" fill="#d7c8b2"/>
  <text x="1488" y="2505" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="24" letter-spacing="3" fill="#8a4c1f">KERNELS · 2026</text>
</svg>
