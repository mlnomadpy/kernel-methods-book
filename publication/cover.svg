<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2560" viewBox="0 0 1600 2560" role="img" aria-labelledby="cover-title cover-desc">
  <title id="cover-title">Kernels: The Geometry of Learning</title>
  <desc id="cover-desc">An ivory mathematical monograph cover showing kernel sections and the Mercer expansion.</desc>
  <defs>
    <filter id="paper-grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="12" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray">
        <feFuncA type="table" tableValues="0 0.035"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="2560" fill="#f3f0e8"/>
  <rect width="1600" height="2560" filter="url(#paper-grain)" opacity="0.45"/>

  <text x="138" y="150" font-family="'IBM Plex Mono', monospace" font-size="24" letter-spacing="3.8" fill="#59666c">A MATHEMATICAL MONOGRAPH ON KERNEL METHODS</text>
  <line x1="138" y1="195" x2="1462" y2="195" stroke="#173d5a" stroke-width="2"/>

  <text x="132" y="510" font-family="'STIX Two Text', Georgia, serif" font-size="190" font-weight="400" fill="#182127">Kernels</text>
  <text x="140" y="655" font-family="'STIX Two Text', Georgia, serif" font-size="92" font-style="italic" fill="#173d5a">The Geometry of Learning</text>
  <text x="140" y="760" font-family="'Source Serif 4', Georgia, serif" font-size="43" fill="#59666c">
    <tspan x="140" dy="0">Foundations, algorithms, and the frontiers</tspan>
    <tspan x="140" dy="58">of machine intelligence</tspan>
  </text>

  <g transform="translate(140 1035)">
    <line x1="0" y1="310" x2="1320" y2="310" stroke="#ccd2d0" stroke-width="2"/>
    <g fill="none" stroke="#173d5a" stroke-width="4">
      <path opacity=".28" d="M0 310 C70 310 90 145 165 145 C240 145 260 310 330 310"/>
      <path opacity=".40" d="M85 310 C180 310 205 82 300 82 C395 82 420 310 515 310"/>
      <path opacity=".54" d="M250 310 C355 310 385 18 500 18 C615 18 645 310 750 310"/>
      <path opacity=".72" d="M440 310 C560 310 595 -32 720 -32 C845 -32 880 310 1000 310"/>
      <path opacity=".55" d="M680 310 C785 310 815 38 925 38 C1035 38 1065 310 1170 310"/>
      <path opacity=".38" d="M910 310 C995 310 1020 112 1110 112 C1200 112 1230 310 1320 310"/>
    </g>
    <g fill="#984a39">
      <circle cx="165" cy="310" r="7"/><circle cx="300" cy="310" r="7"/>
      <circle cx="500" cy="310" r="7"/><circle cx="720" cy="310" r="7"/>
      <circle cx="925" cy="310" r="7"/><circle cx="1110" cy="310" r="7"/>
    </g>
    <text x="0" y="370" font-family="'IBM Plex Mono', monospace" font-size="25" letter-spacing="2" fill="#59666c">KERNEL SECTIONS  k(·, xᵢ)</text>
  </g>

  <g font-family="'Libertinus Math', 'STIX Two Text', Georgia, serif" text-anchor="middle">
    <text x="800" y="1645" font-size="56" fill="#182127">k(x,z) = ⟨Φ(x), Φ(z)⟩ℋ</text>
    <text x="800" y="1755" font-size="52" fill="#173d5a">k(x,z) = Σⱼ≥₁ λⱼ φⱼ(x) φⱼ(z)</text>
  </g>

  <line x1="138" y1="2245" x2="1462" y2="2245" stroke="#173d5a" stroke-width="2"/>
  <text x="138" y="2325" font-family="'STIX Two Text', Georgia, serif" font-size="52" fill="#182127">Taha Bouhsine</text>
  <text x="1462" y="2325" text-anchor="end" font-family="'IBM Plex Mono', monospace" font-size="25" letter-spacing="3" fill="#59666c">2026</text>
</svg>
