schema_version: 1
updated_on: 2026-07-29
purpose: >-
  Editorial routing map for the local research library. This file does not
  replace section-level provenance records; it determines which source should
  be consulted before a chapter is expanded.

sources:
  - file: bach-learning-theory-from-first-principles.pdf
