    edition: author-hosted open-access edition
    chapter_targets:
      ch03: operator bias, variance, and risk decomposition
      ch04: approximation-estimation-optimization ledger and PAC-Bayes bridge
      ch-online: online convex optimization, mirror descent, and lower bounds
      ch-structured: structured surrogates, calibration, and generalization
      ch13: dual, stochastic, and approximation algorithms
      ch-randomized: column sampling and random features
      ch-modern: implicit bias, double descent, and lazy training
      ch14: neural tangent kernels and finite-width boundaries
      ch-rkbs: RKHS and variation-norm comparison

